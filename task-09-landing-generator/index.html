<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>落地页模板生成器</title>
<style>
  :root{--bg:#0d1016;--panel:#161a25;--panel2:#1f2434;--line:#2a3045;--text:#e9ecf4;--muted:#96a0b6;--accent:#6c8cff;--r:14px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:22px 16px 60px}
  header{text-align:center;padding:18px 0}
  header h1{font-size:26px}header h1 b{color:var(--accent)}
  header p{color:var(--muted);font-size:13px;margin-top:6px}
  .layout{display:grid;grid-template-columns:340px 1fr;gap:16px}
  @media(max-width:860px){.layout{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}
  input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 11px;font-size:14px;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  input[type=color]{height:38px;padding:3px;cursor:pointer}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;margin-top:12px}
  .btn.ghost{background:var(--panel2);border:1px solid var(--line)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .tpl{display:flex;gap:8px;flex-wrap:wrap}
  .tpl button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer}
  .tpl button.on{color:#fff;border-color:var(--accent);background:rgba(108,140,255,.18)}
  .frame{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff}
  .frame iframe{width:100%;height:640px;border:0;display:block;background:#fff}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#2b3350;color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:99}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>落地页<b>模板生成器</b></h1><p>选模板 · 填内容 · 实时预览 · 导出 HTML</p></header>
  <div class="layout">
    <div>
      <div class="card">
        <label>模板</label>
        <div class="tpl" id="tpls"></div>
      </div>
      <div class="card">
        <label>品牌名</label><input type="text" id="brand" value="我的产品">
        <label>标语 / 主文案</label><textarea id="slogan">用更简单的方式，搞定你的工作</textarea>
        <label>按钮文字</label><input type="text" id="cta" value="立即开始">
        <label>主色</label><input type="color" id="color" value="#6c8cff">
        <label>微信号 / 链接（选填）</label><input type="text" id="contact" value="my-wechat-id">
      </div>
      <div class="card">
        <label>卖点 1</label><input type="text" id="f1" value="上手快，5 分钟配置完成">
        <label>卖点 2</label><input type="text" id="f2" value="数据安全，隐私零泄露">
        <label>卖点 3</label><input type="text" id="f3" value="价格透明，按需付费">
        <label>价格（选填）</label><input type="text" id="price" value="¥29/月">
      </div>
      <div class="card">
        <div class="row">
          <button class="btn" id="copy">复制 HTML</button>
          <button class="btn ghost" id="dl">下载 HTML</button>
        </div>
      </div>
    </div>
    <div class="card">
      <label>实时预览</label>
      <div class="frame"><iframe id="preview" sandbox="allow-scripts"></iframe></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const TPLS={
  saas:{name:"SaaS 产品页",doc:()=>`
    <!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <style>body{font-family:system-ui,sans-serif;margin:0;color:#111;background:#fff}
    .hero{background:linear-gradient(135deg,{{COLOR}},{{COLOR}}55);color:#fff;padding:90px 20px;text-align:center}
    .hero h1{font-size:42px;margin:0 0 14px}.hero p{font-size:18px;opacity:.92;margin:0 0 26px}
    .btn{display:inline-block;background:#fff;color:{{COLOR}};font-weight:700;padding:14px 34px;border-radius:999px;text-decoration:none}
    .feat{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:1000px;margin:50px auto;padding:0 20px}
    .f{text-align:center;padding:26px 16px;border:1px solid #eee;border-radius:16px}
    .f b{font-size:17px}.f p{color:#666;font-size:14px;margin:10px 0 0}
    .price{text-align:center;padding:44px 20px;background:#f7f8fb}
    .price .big{font-size:34px;font-weight:800;color:{{COLOR}}}
    footer{text-align:center;padding:26px;color:#999;font-size:13px}
    </style></head><body>
    <div class="hero"><h1>{{BRAND}}</h1><p>{{SLOGAN}}</p><a class="btn" href="#">{{CTA}}</a></div>
    <div class="feat"><div class="f"><b>★</b><p>{{F1}}</p></div><div class="f"><b>★</b><p>{{F2}}</p></div><div class="f"><b>★</b><p>{{F3}}</p></div></div>
    <div class="price"><div>定价</div><div class="big">{{PRICE}}</div><p style="color:#888">随时取消，无隐藏费用</p></div>
    <footer>© {{YEAR}} {{BRAND}} · 联系：{{CONTACT}}</footer></body></html>`},
  ecom:{name:"电商促销页",doc:()=>`
    <!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <style>body{font-family:system-ui,sans-serif;margin:0;color:#222;background:#fffaf3}
    .top{background:{{COLOR}};color:#fff;text-align:center;padding:8px;font-size:13px}
    .hero{text-align:center;padding:64px 20px 30px}.hero h1{font-size:36px;margin:0 0 10px}
    .hero p{color:#666;margin:0 0 22px}
    .price-box{display:inline-block;background:#fff;border:2px dashed {{COLOR}};border-radius:16px;padding:20px 40px}
    .price-box .old{color:#aaa;text-decoration:line-through;font-size:15px}
    .price-box .now{color:{{COLOR}};font-size:40px;font-weight:900}
    .btn{display:inline-block;background:{{COLOR}};color:#fff;font-size:18px;font-weight:800;padding:15px 46px;border-radius:999px;text-decoration:none;margin-top:26px}
    .list{max-width:620px;margin:40px auto;padding:0 20px}
    .list li{margin:10px 0;color:#444;font-size:15px}
    footer{text-align:center;padding:30px;color:#aaa;font-size:12px}
    </style></head><body>
    <div class="top">限时活动 · 手慢无</div>
    <div class="hero"><h1>{{BRAND}}</h1><p>{{SLOGAN}}</p>
    <div class="price-box"><div class="old">原价 ¥99</div><div class="now">{{PRICE}}</div><div>限时抢购</div></div><br>
    <a class="btn" href="#">{{CTA}}</a></div>
    <div class="list"><ul><li>{{F1}}</li><li>{{F2}}</li><li>{{F3}}</li></ul></div>
    <footer>© {{YEAR}} {{BRAND}} · 客服：{{CONTACT}}</footer></body></html>`},
  profile:{name:"个人作品集",doc:()=>`
    <!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <style>body{font-family:system-ui,sans-serif;margin:0;color:#1d1d1f;background:#fff}
    .wrap{max-width:760px;margin:0 auto;padding:60px 20px}
    .av{width:96px;height:96px;border-radius:50%;background:{{COLOR}};display:flex;align-items:center;justify-content:center;color:#fff;font-size:38px;font-weight:800;margin-bottom:18px}
    h1{font-size:30px;margin:0 0 6px}p{color:#555;line-height:1.8}
    .tags{margin:20px 0}.tag{display:inline-block;background:#f2f3f7;border-radius:999px;padding:6px 14px;font-size:13px;margin:4px 4px 0 0}
    .btns{margin-top:28px}.btn{display:inline-block;background:{{COLOR}};color:#fff;border-radius:999px;padding:12px 28px;text-decoration:none;font-weight:600;margin-right:10px}
    .btn.ghost{background:#eee;color:#333}
    </style></head><body>
    <div class="wrap"><div class="av">{{INIT}}</div>
    <h1>{{BRAND}}</h1><p>{{SLOGAN}}</p>
    <div class="tags"><span class="tag">{{F1}}</span><span class="tag">{{F2}}</span><span class="tag">{{F3}}</span></div>
    <div class="btns"><a class="btn" href="#">{{CTA}}</a><a class="btn ghost" href="#">作品集</a></div>
    <p style="margin-top:34px;color:#999;font-size:13px">联系：{{CONTACT}}</p></div></body></html>`},
  app:{name:"App 下载页",doc:()=>`
    <!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <style>body{font-family:system-ui,sans-serif;margin:0;color:#fff;background:linear-gradient(160deg,{{COLOR}},{{COLOR}}33)}
    .wrap{max-width:900px;margin:0 auto;padding:80px 20px;display:flex;align-items:center;gap:50px}
    @media(max-width:700px){.wrap{flex-direction:column;text-align:center}}
    .phone{width:200px;height:400px;background:#fff;border-radius:34px;box-shadow:0 30px 60px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;color:{{COLOR}};font-size:15px;font-weight:800;flex-shrink:0}
    h1{font-size:38px;margin:0 0 12px}p{font-size:16px;opacity:.9;line-height:1.8;margin:0 0 26px}
    .btn{display:inline-block;background:#fff;color:{{COLOR}};border-radius:14px;padding:13px 24px;font-weight:800;text-decoration:none;margin:6px 8px 0 0}
    .btn.dark{background:#111;color:#fff}
    .small{margin-top:20px;font-size:12px;opacity:.7}
    </style></head><body>
    <div class="wrap"><div class="phone">App 预览</div><div>
    <h1>{{BRAND}}</h1><p>{{SLOGAN}}</p>
    <a class="btn" href="#">{{CTA}}</a><a class="btn dark" href="#">App Store</a><a class="btn" href="#">安卓下载</a>
    <div class="small">{{F1}} · {{F2}} · {{F3}}</div>
    <div class="small" style="margin-top:8px">联系：{{CONTACT}}</div></div></div></body></html>`}
};

let tpl="saas";
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

function render(){
  const d={BRAND:esc(document.getElementById("brand").value),
    SLOGAN:esc(document.getElementById("slogan").value),
    CTA:esc(document.getElementById("cta").value),
    COLOR:document.getElementById("color").value,
    CONTACT:esc(document.getElementById("contact").value),
    F1:esc(document.getElementById("f1").value),F2:esc(document.getElementById("f2").value),F3:esc(document.getElementById("f3").value),
    PRICE:esc(document.getElementById("price").value),
    INIT:esc((document.getElementById("brand").value||"A").slice(0,1).toUpperCase()),
    YEAR:new Date().getFullYear()};
  let html=TPLS[tpl].doc();
  Object.entries(d).forEach(([k,v])=>{html=html.split("{{"+k+"}}").join(v)});
  document.getElementById("preview").srcdoc=html;
  return html;
}

function initTpls(){
  const box=document.getElementById("tpls");
  Object.entries(TPLS).forEach(([k,v])=>{
    const b=document.createElement("button");b.textContent=v.name;b.dataset.k=k;
    b.onclick=()=>{tpl=k;[...box.children].forEach(x=>x.classList.remove("on"));b.classList.add("on");render()};
    box.appendChild(b);
  });
  box.children[0].classList.add("on");
}

function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1600)}

["brand","slogan","cta","color","contact","f1","f2","f3","price"].forEach(id=>{
  document.getElementById(id).addEventListener("input",render);
});
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(render()).then(()=>toast("HTML 已复制"))};
document.getElementById("dl").onclick=()=>{
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([render()],{type:"text/html;charset=utf-8"}));a.download=(document.getElementById("brand").value||"landing")+".html";a.click();toast("已下载");
};
initTpls();render();
</script>
</body>
</html>
