<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 记账 / 财务小助手</title>
<style>
  :root{--bg:#0d1016;--panel:#161a25;--panel2:#1f2434;--line:#2a3045;--text:#e9ecf4;--muted:#96a0b6;--green:#3ddc97;--red:#ff6b81;--gold:#ffc24d;--accent:#6c8cff;--r:14px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:24px 16px 70px}
  header{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
  header h1{font-size:24px}header h1 b{color:var(--green)}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
  @media(max-width:720px){.cards{grid-template-columns:1fr 1fr}}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
  .stat .label{font-size:12px;color:var(--muted)}
  .stat .num{font-size:22px;font-weight:800;margin-top:4px}
  .green{color:var(--green)}.red{color:var(--red)}.gold{color:var(--gold)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  @media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  input,select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 11px;font-size:14px;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  .btn{background:var(--green);color:#06231a;border:none;border-radius:10px;padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer}
  .btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
  .btn.red{background:var(--red);color:#2a050c}
  .btn.sm{padding:5px 9px;font-size:12px;border-radius:7px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);font-weight:600}
  td{padding:8px;border-bottom:1px solid rgba(42,48,69,.5)}
  .tag{display:inline-block;font-size:11px;border-radius:6px;padding:2px 8px}
  .tag.in{background:rgba(61,220,151,.14);color:var(--green)}
  .tag.out{background:rgba(255,107,129,.14);color:var(--red)}
  .tip{background:linear-gradient(135deg,rgba(108,140,255,.12),transparent);border:1px solid rgba(108,140,255,.3);border-radius:10px;padding:12px;margin-top:10px;font-size:13px;line-height:1.7}
  canvas{max-width:100%}
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:720px){.charts{grid-template-columns:1fr}}
  .empty{color:var(--muted);text-align:center;padding:20px 0;font-size:13px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#2b3350;color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:99}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>AI 记账<b>·财务小助手</b></h1><div class="row"><button class="btn ghost sm" id="exportCsv">导出 CSV</button><button class="btn ghost sm" id="reset">重置演示数据</button></div></header>

  <div class="cards">
    <div class="stat"><div class="label">本月收入</div><div class="num green" id="sIn">¥0</div></div>
    <div class="stat"><div class="label">本月支出</div><div class="num red" id="sOut">¥0</div></div>
    <div class="stat"><div class="label">结余</div><div class="num" id="sBal">¥0</div></div>
    <div class="stat"><div class="label">预算剩余</div><div class="num gold" id="sBud">¥0</div></div>
  </div>

  <div class="card">
    <div class="grid3">
      <div><label>类型</label><select id="fType"><option value="out">支出</option><option value="in">收入</option></select></div>
      <div><label>分类</label><select id="fCat"></select></div>
      <div><label>金额（¥）</label><input type="number" id="fAmt" min="0" step="0.01" placeholder="0.00"></div>
    </div>
    <div class="grid2" style="margin-top:12px">
      <div><label>日期</label><input type="date" id="fDate"></div>
      <div><label>备注</label><input type="text" id="fNote" placeholder="可选"></div>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="add">记一笔</button>
      <span style="font-size:12px;color:var(--muted)">月度预算</span>
      <input type="number" id="budget" style="width:110px" placeholder="3000">
      <button class="btn ghost sm" id="setBud">设置</button>
    </div>
  </div>

  <div class="card">
    <label>收支趋势（近 7 日）</label>
    <canvas id="trend" height="140"></canvas>
  </div>

  <div class="card">
    <label>分类占比（本月支出）</label>
    <div class="charts">
      <canvas id="pie" height="200"></canvas>
      <div id="legend"></div>
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <label style="margin:0">流水明细</label>
      <button class="btn ghost sm" id="delAll">清空流水</button>
    </div>
    <div id="table"><div class="empty">还没有记录</div></div>
    <div id="tips"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const CATS = {
  in:["工资","副业","投资收益","红包","退款","其他收入"],
  out:["餐饮","交通","购物","住房","娱乐","医疗","教育","人情","宠物","其他支出"]
};
const state={items:[],budget:3000};

const demo=[
  {type:"in",cat:"工资",amt:8000,date:"2026-08-03",note:"工资"},
  {type:"out",cat:"餐饮",amt:35.5,date:"2026-08-05",note:"午餐"},
  {type:"out",cat:"交通",amt:12,date:"2026-08-06",note:"地铁"},
  {type:"out",cat:"购物",amt:299,date:"2026-08-08",note:"耳机"},
  {type:"out",cat:"餐饮",amt:68,date:"2026-08-09",note:"聚餐"},
  {type:"out",cat:"娱乐",amt:45,date:"2026-08-11",note:"电影"},
  {type:"in",cat:"副业",amt:1200,date:"2026-08-12",note:"接单"},
  {type:"out",cat:"住房",amt:1500,date:"2026-08-13",note:"房租"},
  {type:"out",cat:"购物",amt:120,date:"2026-08-14",note:"日用品"},
  {type:"out",cat:"餐饮",amt:25,date:"2026-08-15",note:"早餐"}
];

function load(){
  try{const raw=JSON.parse(localStorage.getItem("ledger")||"null");if(raw&&raw.items)state.items=raw.items;if(raw&&raw.budget)state.budget=raw.budget}catch(e){}
  if(!state.items.length){state.items=demo.slice();save()}
}
function save(){localStorage.setItem("ledger",JSON.stringify({items:state.items,budget:state.budget}))}

function today(){const d=new Date();return d.toISOString().slice(0,10)}
function monthOf(){return today().slice(0,7)}
function fmt(n){return "¥"+Number(n).toFixed(2)}

function initCats(){
  const sel=document.getElementById("fCat");sel.innerHTML="";
  CATS.out.forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c;sel.appendChild(o)});
  document.getElementById("fType").onchange=e=>{
    sel.innerHTML="";
    CATS[e.target.value].forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c;sel.appendChild(o)});
  };
}

function stats(){
  const m=monthOf();
  let inc=0,out=0;
  state.items.forEach(i=>{if(i.date.slice(0,7)===m){if(i.type==="in")inc+=+i.amt;else out+=+i.amt}});
  document.getElementById("sIn").textContent=fmt(inc);
  document.getElementById("sOut").textContent=fmt(out);
  document.getElementById("sBal").textContent=fmt(inc-out);
  document.getElementById("sBud").textContent=fmt(Math.max(0,state.budget-out));
  return {inc,out};
}

function renderTable(){
  const box=document.getElementById("table");
  if(!state.items.length){box.innerHTML='<div class="empty">还没有记录</div>';return}
  const sorted=state.items.slice().sort((a,b)=>b.date.localeCompare(a.date));
  let h="<table><tr><th>日期</th><th>类型</th><th>分类</th><th>备注</th><th style='text-align:right'>金额</th><th></th></tr>";
  sorted.forEach((it,idx)=>{
    const orig=state.items.indexOf(it);
    h+=`<tr><td>${it.date}</td><td><span class="tag ${it.type==="in"?"in":"out"}">${it.type==="in"?"收入":"支出"}</span></td><td>${it.cat}</td><td>${esc(it.note||"")}</td><td style="text-align:right;color:${it.type==="in"?"var(--green)":"var(--red)"}">${it.type==="in"?"+":"-"}${Number(it.amt).toFixed(2)}</td><td style="text-align:right"><button class="btn red sm" data-i="${orig}">删</button></td></tr>`;
  });
  h+="</table>";
  box.innerHTML=h;
  box.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{state.items.splice(+b.dataset.i,1);save();renderAll()});
}

function trendChart(){
  const cv=document.getElementById("trend");const ctx=cv.getContext("2d");
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d.toISOString().slice(0,10))}
  const out=days.map(day=>state.items.filter(x=>x.date===day&&x.type==="out").reduce((s,x)=>s+ +x.amt,0));
  const inx=days.map(day=>state.items.filter(x=>x.date===day&&x.type==="in").reduce((s,x)=>s+ +x.amt,0));
  const W=cv.width=Math.max(280,cv.clientWidth)*2,H=cv.height=140*2;ctx.clearRect(0,0,W,H);ctx.scale(2,2);
  const pad=36,chartW=W/2-pad*1.6,chartH=H/2-36,max=Math.max(...out,1);
  const bw=chartW/7*0.6;
  days.forEach((d,i)=>{
    const x=pad*1.2+i*chartW/7;
    const h1=out[i]/max*chartH,h2=inx[i]/max*chartH;
    ctx.fillStyle="rgba(255,107,129,.85)";ctx.fillRect(x,chartH-h1+10,bw,h1);
    ctx.fillStyle="rgba(61,220,151,.85)";ctx.fillRect(x+bw+3,chartH-h2+10,bw,h2);
    ctx.fillStyle="#96a0b6";ctx.font="10px sans-serif";ctx.textAlign="center";
    ctx.fillText(d.slice(5),x+bw,chartH+22);
  });
  ctx.strokeStyle="#2a3045";ctx.beginPath();ctx.moveTo(pad*1.2-4,10);ctx.lineTo(pad*1.2-4,chartH+10);ctx.stroke();
  ctx.fillStyle="#96a0b6";ctx.font="10px sans-serif";ctx.textAlign="left";
  ctx.fillText("支出",pad*1.2-20,16);ctx.fillStyle="#3ddc97";ctx.fillText("收入",pad*1.2-20,30);
}

function pieChart(){
  const cv=document.getElementById("pie");const ctx=cv.getContext("2d");
  const m=monthOf();
  const byCat={};
  state.items.forEach(i=>{if(i.date.slice(0,7)===m&&i.type==="out")byCat[i.cat]=(byCat[i.cat]||0)+ +i.amt});
  const entries=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const total=entries.reduce((s,e)=>s+e[1],0);
  const W=cv.width=Math.max(240,cv.clientWidth/2)*2,H=cv.height=200*2;
  ctx.clearRect(0,0,W,H);ctx.scale(2,2);
  const cx=W/4,cy=H/4,r=Math.min(cx,cy)-16;
  const colors=["#ff6b81","#ffc24d","#6c8cff","#3ddc97","#c084fc","#f472b6","#34d399","#f59e0b","#60a5fa","#94a3b8"];
  let ang=-Math.PI/2;
  entries.forEach((e,i)=>{
    const a=e[1]/total*Math.PI*2;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,ang,ang+a);ctx.closePath();
    ctx.fillStyle=colors[i%colors.length];ctx.fill();
    ang+=a;
  });
  if(!total){ctx.fillStyle="#96a0b6";ctx.font="13px sans-serif";ctx.textAlign="center";ctx.fillText("本月暂无支出",cx,cy)}
  const legend=document.getElementById("legend");
  if(!entries.length){legend.innerHTML='<div class="empty">暂无数据</div>';return}
  legend.innerHTML=entries.map((e,i)=>`<div style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px"><span style="width:10px;height:10px;border-radius:3px;background:${colors[i%colors.length]}"></span>${e[0]}<span style="margin-left:auto;color:var(--muted)">${fmt(e[1])}（${(e[1]/total*100).toFixed(1)}%）</span></div>`).join("");
}

function tips(){
  const box=document.getElementById("tips");box.innerHTML="";
  const {inc,out}=stats();
  const m=monthOf();
  const outCat={};
  state.items.forEach(i=>{if(i.date.slice(0,7)===m&&i.type==="out")outCat[i.cat]=(outCat[i.cat]||0)+ +i.amt});
  const sorted=Object.entries(outCat).sort((a,b)=>b[1]-a[1]);
  const t=[];
  if(out>state.budget)t.push("⚠ 本月支出已超过预算，建议暂停非必要消费，优先砍掉最高支出分类。");
  else if(out>state.budget*0.8)t.push("⚠ 预算已用 80%，后半程建议按"50/30/20"原则控制。");
  if(sorted[0])t.push(`💡 本月最大支出是「${sorted[0][0]}」（${fmt(sorted[0][1])}），如果占支出 30% 以上，可以考虑寻找替代方案。`);
  const eat=outCat["餐饮"]||0;
  if(eat>500)t.push(`🍜 餐饮支出 ${fmt(eat)} 较高，试试每周 2 次带饭，一个月可省 200-400 元。`);
  if(inc>0&&inc-out<out*0.3)t.push("📈 结余率偏低，建议执行"先存后花"：工资到账先转 10% 到储蓄账户。");
  if(!t.length)t.push("✅ 本月财务状况健康，继续保持！建议把结余的 20% 用于应急储备。");
  box.innerHTML=t.map(x=>`<div class="tip">${x}</div>`).join("");
}

function renderAll(){stats();renderTable();trendChart();pieChart();tips()}
function esc(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1600)}

document.getElementById("add").onclick=()=>{
  const type=document.getElementById("fType").value;
  const cat=document.getElementById("fCat").value;
  const amt=parseFloat(document.getElementById("fAmt").value);
  const date=document.getElementById("fDate").value||today();
  const note=document.getElementById("fNote").value.trim();
  if(!amt||amt<=0)return toast("请输入有效金额");
  state.items.push({type,cat,amt,date,note});save();renderAll();
  document.getElementById("fAmt").value="";document.getElementById("fNote").value="";
  toast("已记一笔");
};
document.getElementById("setBud").onclick=()=>{
  const v=parseFloat(document.getElementById("budget").value);
  if(!v||v<=0)return toast("预算需大于 0");
  state.budget=v;save();renderAll();toast("预算已更新");
};
document.getElementById("delAll").onclick=()=>{state.items=[];save();renderAll();toast("已清空流水")};
document.getElementById("reset").onclick=()=>{state.items=demo.slice();state.budget=3000;save();renderAll();toast("已重置演示数据")};
document.getElementById("exportCsv").onclick=()=>{
  const rows=[["日期","类型","分类","金额","备注"]].concat(state.items.map(i=>[i.date,i.type==="in"?"收入":"支出",i.cat,i.amt,i.note||""]));
  const csv="\uFEFF"+rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="记账导出.csv";a.click();
};

load();initCats();renderAll();
document.getElementById("budget").value=state.budget;
</script>
</body>
</html>
