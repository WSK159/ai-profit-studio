<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山海图鉴 · 收集</title>
<style>
  :root{--bg:#0c0f16;--panel:#141a29;--panel2:#1b2235;--line:#2a3350;--text:#e9ecf5;--muted:#8f99b3;--gold:#ffc24d;--accent:#9f7cff;--r:14px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
  .wrap{max-width:820px;margin:0 auto;padding:18px}
  header{display:flex;justify-content:space-between;align-items:center;padding:8px 0 14px}
  header h1{font-size:24px;letter-spacing:2px}header h1 span{color:var(--accent)}
  .bar{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 20px;font-size:14px;font-weight:800;cursor:pointer}
  .btn.gold{background:var(--gold);color:#2a1d00}
  .btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
  .prog{height:8px;background:#221a2e;border-radius:99px;overflow:hidden;margin-top:8px}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,#9f7cff,#ffc24d);width:0;transition:width .3s}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;cursor:pointer;position:relative;transition:.15s}
  .card:hover{transform:translateY(-3px)}
  .card .ico{font-size:34px}
  .card .nm{font-size:13px;font-weight:800;margin-top:6px}
  .card .rar{font-size:10px;margin-top:2px}
  .card.locked{opacity:.35;filter:grayscale(1)}
  .r-n{color:#9aa6c2}.r-r{color:#6c9bff}.r-e{color:#c084fc}.r-l{color:#ffc24d}
  #pack{position:fixed;inset:0;background:rgba(8,10,16,.9);display:none;align-items:center;justify-content:center;z-index:9}
  #pack .box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;text-align:center;max-width:520px}
  #pack .cards{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0}
  #quiz{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px;font-size:13px;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>山海<span>图鉴</span></h1><div style="font-size:12px;color:var(--muted)">灵气 <b id="qi" style="color:var(--gold)">100</b></div></header>
  <div class="bar">
    <div style="flex:1"><b id="count">0/24</b> 已收录<div class="prog"><i id="prog"></i></div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn gold" id="open">开卡包（50 灵气）</button>
      <button class="btn ghost" id="checkin">每日签到</button>
      <button class="btn ghost" id="craft">合成（100 灵尘）</button>
    </div>
  </div>
  <div id="quiz"></div>
  <div class="grid" id="grid" style="margin-top:12px"></div>
</div>
<div id="pack"><div class="box"><h2 style="color:var(--gold)">开包</h2><div class="cards" id="packCards"></div><button class="btn" id="packClose">收下</button></div></div>

<script>
const BEASTS=[
  ["九尾狐","🦊","e","青丘之兽，善惑人心"],["白泽","🦄","l","通晓万物之名的神兽"],
  ["穷奇","🐯","e","四凶之一，喜食善人"],["饕餮","🐲","e","贪食之兽，吞天噬地"],
  ["梼杌","🐺","e","四凶之一，顽固凶戾"],["混沌","🕳","l","无面目之兽，识歌舞"],
  ["毕方","🐦","r","独脚神鸟，见则大火"],["重明鸟","🦜","e","目有双瞳，能逐凶兽"],
  ["麒麟","🦌","l","瑞兽之首，仁厚之兽"],["凤凰","🦚","l","百鸟之王，浴火重生"],
  ["应龙","🐉","l","有翼之龙，司雨之神"],["烛龙","🐍","l","人面蛇身，昼夜之神"],
  ["当康","🐗","r","兆丰年之兽"],["夫诸","🦌","r","见则大水"],["陵鱼","🐟","r","人面鱼身，出则大水"],
  ["山膏","🐷","r","善骂人之兽"],["鹿蜀","🦓","r","佩之宜子孙"],["旋龟","🐢","r","其音如木"],
  ["蠃鱼","🐡","n","鱼身鸟翼，音如鸳鸯"],["冉遗","🐍","n","佩之无梦魇"],
  ["耳鼠","🐭","n","其腹有翼，飞不上升"],["孟槐","🦔","n","辟凶之兽"],
  ["长右","🐒","n","长右之山多水"],["灌灌","🐔","n","其音如木，佩之不惑"]
];
const QUIZ=[
  ["以下哪只不是《山海经》四凶之一？","麒麟",["穷奇","饕餮","梼杌","麒麟"]],
  ["「目有双瞳」指的是？","重明鸟",["毕方","重明鸟","当康","鹿蜀"]],
  ["人面蛇身、视为昼瞑为夜的是？","烛龙",["应龙","烛龙","旋龟","冉遗"]],
  ["九尾狐出自哪座山？","青丘",["长右","青丘","鹿吴","基山"]],
  ["「见则大水」的鱼是？","蠃鱼",["蠃鱼","陵鱼","鲛人","文鳐鱼"]]
];
const RAR={n:"普通",r:"稀有",e:"史诗",l:"传说"};
let qi=+localStorage.getItem("tujian_qi")||100,dust=+localStorage.getItem("tujian_dust")||0;
let owned=JSON.parse(localStorage.getItem("tujian_owned")||"[]");
let lastCheck=localStorage.getItem("tujian_check")||"",quizIdx=0;

function save(){localStorage.setItem("tujian_qi",qi);localStorage.setItem("tujian_dust",dust);localStorage.setItem("tujian_owned",JSON.stringify(owned));localStorage.setItem("tujian_check",lastCheck)}
function rnd(n){return Math.floor(Math.random()*n)}
function weight(){
  const r=Math.random();
  if(r<0.55)return 0;if(r<0.85)return 1;if(r<0.97)return 2;return 3;
}
function openPack(){
  if(qi<50){alert("灵气不足");return}
  qi-=50;const cards=[];
  for(let i=0;i<3;i++){
    const rar=weight();
    const pool=BEASTS.filter(b=>b[2]===rar);
    cards.push(pool[rnd(pool.length)]);
  }
  const box=document.getElementById("packCards");box.innerHTML="";
  cards.forEach(c=>{
    const d=document.createElement("div");d.className="card";
    d.innerHTML=`<div class="ico">${c[1]}</div><div class="nm">${c[0]}</div><div class="rar r-${c[2]}">${RAR[c[2]]}</div>`;
    box.appendChild(d);
    if(!owned.includes(c[0]))owned.push(c[0]);else dust+=8;
  });
  save();render();
  document.getElementById("pack").style.display="flex";
}
function render(){
  document.getElementById("qi").textContent=qi;
  document.getElementById("count").textContent=owned.length+"/"+BEASTS.length;
  document.getElementById("prog").style.width=(owned.length/BEASTS.length*100)+"%";
  const grid=document.getElementById("grid");grid.innerHTML="";
  BEASTS.forEach(b=>{
    const has=owned.includes(b[0]);
    const d=document.createElement("div");d.className="card"+(has?"":" locked");
    d.innerHTML=`<div class="ico">${has?b[1]:"❔"}</div><div class="nm">${has?b[0]:"？？？"}</div><div class="rar r-${b[2]}">${has?RAR[b[2]]:"未收录"}</div>`;
    d.title=b[3];
    grid.appendChild(d);
  });
}
function checkin(){
  const today=new Date().toISOString().slice(0,10);
  if(lastCheck===today){alert("今天已签到");return}
  lastCheck=today;qi+=30;save();render();alert("签到成功，灵气 +30");
}
function craft(){
  if(dust<100){alert("灵尘不足（重复卡可得 8 灵尘）");return}
  const missing=BEASTS.filter(b=>!owned.includes(b[0]));
  if(!missing.length){alert("图鉴已集齐！");return}
  dust-=100;const b=missing[rnd(missing.length)];owned.push(b[0]);
  save();render();alert("合成了【"+b[0]+"】！");
}
function quiz(){
  const q=QUIZ[quizIdx%QUIZ.length];
  const box=document.getElementById("quiz");
  box.innerHTML=`<b>📖 今日观山海：</b>${q[0]}<div style="margin-top:8px">`+
    q[2].map((o,i)=>`<button class="btn ghost" style="margin:4px 6px 0 0;padding:6px 12px;font-size:12px" data-i="${i}">${o}</button>`).join("")+`</div>`;
  box.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    if(q[2][+b.dataset.i]===q[1]){
      qi+=15;quizIdx++;save();render();alert("答对了！灵气 +15");
    }else{alert("答错了，答案是 "+q[1]+"（下次再试）")}
    box.innerHTML="";
  });
}
document.getElementById("open").onclick=openPack;
document.getElementById("packClose").onclick=()=>document.getElementById("pack").style.display="none";
document.getElementById("checkin").onclick=checkin;
document.getElementById("craft").onclick=craft;
render();quiz();
</script>
</body>
</html>
