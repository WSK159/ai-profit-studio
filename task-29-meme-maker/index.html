<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>表情包生成器</title>
<style>
  :root{--bg:#0d0f16;--panel:#161a26;--panel2:#1e2334;--line:#2b3249;--text:#eceef6;--muted:#97a0b8;--accent:#ffc24d;--r:14px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .wrap{width:100%;max-width:760px;padding:18px}
  header{text-align:center;padding:10px 0 16px}
  header h1{font-size:26px}header h1 span{color:var(--accent)}
  .layout{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
  @media(max-width:720px){.layout{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}
  input[type=text],textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 11px;font-size:14px;outline:none}
  input:focus,textarea:focus{border-color:var(--accent)}
  .btn{background:var(--accent);color:#2a1d00;border:none;border-radius:10px;padding:10px 20px;font-size:14px;font-weight:800;cursor:pointer;margin-top:10px;width:100%}
  .styles{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .style{width:52px;height:40px;border-radius:8px;border:2px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
  .style.on{border-color:var(--accent)}
  .emojis{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .emojis button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;font-size:18px;cursor:pointer;padding:4px 8px}
  canvas{width:100%;border-radius:12px;background:#000}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>表情包<span>生成器</span></h1></header>
  <div class="layout">
    <div class="card">
      <canvas id="cv" width="600" height="600"></canvas>
      <button class="btn" id="dl">下载 PNG</button>
    </div>
    <div class="card">
      <label>上方文字</label>
      <input type="text" id="top" value="我太难了">
      <label>下方文字</label>
      <input type="text" id="bottom" value="真的会谢">
      <label>风格</label>
      <div class="styles" id="styles"></div>
      <label>字号 <span id="sizeVal">60</span></label>
      <input type="range" id="size" min="24" max="120" value="60">
      <label>快捷表情</label>
      <div class="emojis" id="emojis"></div>
      <label>自定义 emoji（插到文字末尾）</label>
      <input type="text" id="extra" placeholder="🤣">
    </div>
  </div>
</div>

<script>
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
const STYLES=[
  {n:"白底",bg:"#ffffff",fg:"#000000",stroke:"#ffffff"},
  {n:"黄底",bg:"#ffcc00",fg:"#000000",stroke:"#ffcc00"},
  {n:"黑底",bg:"#111111",fg:"#ffffff",stroke:"#111111"},
  {n:"绿底",bg:"#3ddc97",fg:"#06231a",stroke:"#3ddc97"},
  {n:"粉底",bg:"#ff9ec4",fg:"#4a0f28",stroke:"#ff9ec4"}
];
const EMOJIS=["😂","🤣","😭","😡","🥺","👍","👏","😱","🤔","💀","🔥","❤️"];
let style=0;

function wrapText(text,maxWidth){
  const words=text.split("");
  const lines=[];let line="";
  for(const ch of words){
    const test=line+ch;
    if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=ch}
    else line=test;
  }
  if(line)lines.push(line);
  return lines;
}

function draw(){
  const s=STYLES[style];
  ctx.fillStyle=s.bg;ctx.fillRect(0,0,cv.width,cv.height);
  const fontSize=+document.getElementById("size").value;
  document.getElementById("sizeVal").textContent=fontSize;
  ctx.font="900 "+fontSize+"px 'Microsoft YaHei',sans-serif";
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.lineWidth=Math.max(4,fontSize*0.12);
  ctx.lineJoin="round";
  ctx.strokeStyle=s.stroke;
  ctx.fillStyle=s.fg;
  const pad=30;
  const topTxt=(document.getElementById("top").value+document.getElementById("extra").value).trim();
  const botTxt=document.getElementById("bottom").value.trim();
  if(topTxt){
    const lines=wrapText(topTxt,cv.width-pad*2);
    const lh=fontSize*1.05;
    const startY=cv.height*0.12-(lines.length-1)*lh/2;
    lines.forEach((l,i)=>{
      ctx.strokeText(l,cv.width/2,startY+i*lh);
      ctx.fillText(l,cv.width/2,startY+i*lh);
    });
  }
  if(botTxt){
    const lines=wrapText(botTxt,cv.width-pad*2);
    const lh=fontSize*1.05;
    const startY=cv.height*0.88-(lines.length-1)*lh/2;
    lines.forEach((l,i)=>{
      ctx.strokeText(l,cv.width/2,startY+i*lh);
      ctx.fillText(l,cv.width/2,startY+i*lh);
    });
  }
}

const stylesBox=document.getElementById("styles");
STYLES.forEach((s,i)=>{
  const b=document.createElement("div");
  b.className="style"+(i===0?" on":"");
  b.style.background=s.bg;b.style.color=s.fg;b.textContent=s.n;
  b.onclick=()=>{style=i;[...stylesBox.children].forEach(x=>x.classList.remove("on"));b.classList.add("on");draw()};
  stylesBox.appendChild(b);
});
const emojiBox=document.getElementById("emojis");
EMOJIS.forEach(e=>{
  const b=document.createElement("button");b.textContent=e;
  b.onclick=()=>{document.getElementById("extra").value+=e;draw()};
  emojiBox.appendChild(b);
});
document.getElementById("dl").onclick=()=>{
  const a=document.createElement("a");a.href=cv.toDataURL("image/png");a.download="meme.png";a.click();
};
["top","bottom","extra","size"].forEach(id=>document.getElementById(id).addEventListener("input",draw));
draw();
</script>
</body>
</html>
