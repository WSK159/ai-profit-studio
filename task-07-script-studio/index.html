<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>短视频脚本工作台</title>
<style>
  :root{--bg:#0e1016;--panel:#171b26;--panel2:#20263a;--line:#2b3248;--text:#e9ecf4;--muted:#97a0b5;--accent:#ff8a5c;--accent2:#5cd6a8;--danger:#ff6b81;--r:14px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:26px 16px 70px}
  header{text-align:center;padding:22px 0}
  header h1{font-size:28px}
  header h1 b{color:var(--accent)}
  header p{color:var(--muted);font-size:14px;margin-top:6px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  @media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  input[type=text],select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 11px;font-size:14px;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  textarea{min-height:56px;resize:vertical}
  .btn{background:var(--accent);color:#1a0e08;border:none;border-radius:10px;padding:11px 22px;font-size:15px;font-weight:700;cursor:pointer}
  .btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
  .btn.green{background:var(--accent2);color:#06231a}
  .btn.sm{padding:6px 10px;font-size:12px;border-radius:7px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .shot{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px;margin-top:10px}
  .shot .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .shot .no{font-weight:800;color:var(--accent)}
  .shot .dur{font-size:12px;color:var(--muted)}
  .shot textarea{font-size:13px}
  .hook{background:linear-gradient(135deg,rgba(255,138,92,.14),rgba(255,138,92,.03));border:1px solid rgba(255,138,92,.35);border-radius:10px;padding:12px;margin-top:10px}
  .empty{color:var(--muted);text-align:center;padding:28px 0;font-size:13px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#2b3350;color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:99}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>短视频<b>脚本工作台</b></h1>
    <p>输入选题 → 一键生成钩子 + 分镜 + 台词 + 字幕 + CTA</p>
  </header>

  <div class="card">
    <div class="grid3">
      <div><label>选题 / 主题</label><input type="text" id="topic" placeholder="例：新手做自媒体，先别买设备"></div>
      <div><label>时长</label><select id="dur"><option value="15">15 秒</option><option value="30" selected>30 秒</option><option value="60">60 秒</option></select></div>
      <div><label>目标</label><select id="goal"><option value="涨粉">涨粉</option><option value="带货">带货</option><option value="人设">人设</option><option value="引流私域">引流私域</option></select></div>
    </div>
    <div style="margin-top:12px"><label>结构模板</label>
      <div class="row" id="tpls"></div>
    </div>
    <div class="row" style="margin-top:16px">
      <button class="btn" id="gen">生成脚本</button>
      <button class="btn ghost" id="copyAll">复制全文</button>
      <button class="btn ghost" id="export">导出 JSON</button>
      <button class="btn ghost" id="clear">清空</button>
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <label style="margin:0">脚本预览</label>
      <span id="meta" style="font-size:12px;color:var(--muted)"></span>
    </div>
    <div id="out"><div class="empty">输入选题，点击"生成脚本"</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const TEMPLATES = {
  sanduan:{name:"三段式", shots:["开头冲突","过程转折","结果升华"]},
  xuanian:{name:"悬念式", shots:["抛出反常","解释原因","揭晓答案"]},
  qingdan:{name:"清单式", shots:["总起","要点1","要点2","要点3","收尾"]},
  duibi:{name:"对比式", shots:["错误做法","正确做法","对比总结"]},
  gushi:{name:"故事式", shots:["场景带入","遇到问题","努力解决","结果反转"]},
  ganhuo:{name:"干货式", shots:["痛点开场","方法演示","实操要点","行动号召"]}
};

const HOOKS = {
  "涨粉":["别划走，接下来 30 秒可能改变你的认知","这条视频，我劝你先看完再评论","90% 的人都不知道的真相，今天说清楚"],
  "带货":["你还在花冤枉钱？这个才是对的","闭眼入，不好用你回来找我","便宜没好货？那是你没见过这个"],
  "人设":["我做这一行第 8 年，说几句实话","不装了，今天全交代","你们总问我是怎么做到的，今天说透"],
  "引流私域":["这条视频只发一次，看完记得保存","想抄作业的，结尾有入口","完整版我放在粉丝群了，先看完这条"]
};

const CTAS = {
  "涨粉":["觉得有用就点个关注，下期继续拆","关注我，每天一条实操干货","点赞收藏，别找不到了"],
  "带货":["左下角小黄车，今天有福利价","链接放这了，手慢无","下单前记得领券，能省不少"],
  "人设":["关注我，见证我从 0 到 10 万粉","一起成长，点个关注","喜欢这种真实内容就关注我"],
  "引流私域":["主页有联系方式，备注'教程'通过","评论区扣 1，我把资料发你","完整清单在主页粉丝群，快来"]
};

const state={shotTpl:"sanduan", script:null};
let seq=0;

function init(){
  const box=document.getElementById("tpls");
  Object.entries(TEMPLATES).forEach(([k,v])=>{
    const c=document.createElement("span");
    c.className="chip"; c.style.cssText="background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer;color:var(--muted)";
    c.textContent=v.name;
    c.onclick=()=>{ state.shotTpl=k; [...box.children].forEach(x=>x.style.cssText=c.style.cssText); c.style.borderColor="var(--accent)"; c.style.color="#fff"; };
    box.appendChild(c);
  });
  box.children[0].style.borderColor="var(--accent)"; box.children[0].style.color="#fff";
}

function pick(a){return a[Math.floor(Math.random()*a.length)]}

function genScript(){
  const topic=document.getElementById("topic").value.trim();
  if(!topic){toast("请先输入选题");return}
  const dur=parseInt(document.getElementById("dur").value);
  const goal=document.getElementById("goal").value;
  const tpl=TEMPLATES[state.shotTpl];
  const hook=pick(HOOKS[goal]).replace("30 秒", dur+" 秒");
  const cta=pick(CTAS[goal]);
  const per=Math.max(3,Math.floor(dur/tpl.shots.length));
  const shots=tpl.shots.map((name,i)=>{
    const sec=i===tpl.shots.length-1?dur-(tpl.shots.length-1)*per:per;
    return {no:++seq,name,sec,view:"",scene:"",line:"",sub:"",sfx:""};
  });
  const lines=[
    pick(["很多人一上来就搞错了","先别急着做，听我说完","这件事，90% 的人第一步就错了"]),
    pick(["正确做法其实很简单","记住这三个字","关键在于下面这一点"]),
    pick(["具体怎么落地？看演示","我踩过的坑，你别再踩了","细节决定成败"]),
    pick(["坚持 30 天，你会回来谢我","方法教你了，执行力看你自己","别光收藏，动手做一次"])
  ];
  shots.forEach((s,i)=>{
    s.view=pick(["近景口播","中景演示","特写手部","手机录屏","实拍场景","字幕卡"]);
    s.scene=pick(["家里书桌前","工作台前","户外街景","纯色背景","白板讲解","道具展示"]);
    s.line=i===0?hook:(i===shots.length-1?cta:lines[i%lines.length]);
    s.sub=s.line;
    s.sfx=i===0?"提示音/炸点音效":pick(["轻快 BGM","紧张音效","键盘声","环境音","无声留白"]);
  });
  state.script={topic,goal,dur,tpl:tpl.name,shots};
  document.getElementById("meta").textContent=`${topic} · ${dur}s · ${goal} · ${tpl.name}`;
  render();
}

function render(){
  const box=document.getElementById("out");
  if(!state.script){box.innerHTML='<div class="empty">输入选题，点击"生成脚本"</div>';return}
  box.innerHTML="";
  const hook=document.createElement("div");
  hook.className="hook";
  hook.innerHTML=`<b style="color:var(--accent)">⚡ 钩子开头</b><p style="margin-top:6px;line-height:1.6">${esc(state.script.shots[0].line)}</p>`;
  box.appendChild(hook);
  state.script.shots.forEach(s=>{
    const d=document.createElement("div");
    d.className="shot";
    d.innerHTML=`<div class="head"><span class="no">镜头 ${s.no}</span><span class="dur">${s.sec}s</span></div>
      <div class="grid2">
        <div><label>景别</label><input type="text" value="${esc(s.view)}" data-k="view"></div>
        <div><label>场景</label><input type="text" value="${esc(s.scene)}" data-k="scene"></div>
      </div>
      <div style="margin-top:8px"><label>台词</label><textarea data-k="line">${esc(s.line)}</textarea></div>
      <div style="margin-top:8px"><label>字幕</label><textarea data-k="sub">${esc(s.sub)}</textarea></div>
      <div style="margin-top:8px"><label>音效/BGM</label><input type="text" value="${esc(s.sfx)}" data-k="sfx"></div>`;
    d.querySelectorAll("[data-k]").forEach(el=>{
      el.addEventListener("input",()=>{s[el.dataset.k]=el.value});
    });
    box.appendChild(d);
  });
  const tail=document.createElement("div");
  tail.className="hook";
  tail.innerHTML=`<b style="color:var(--accent2)">🎯 CTA 收尾</b><p style="margin-top:6px;line-height:1.6">${esc(state.script.shots[state.script.shots.length-1].line)}</p>`;
  box.appendChild(tail);
}

function esc(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1600)}

document.getElementById("gen").onclick=genScript;
document.getElementById("copyAll").onclick=()=>{
  if(!state.script)return toast("先生成脚本");
  const s=state.script;
  const txt=[`选题：${s.topic}（${s.dur}s·${s.goal}·${s.tpl}）`,`【钩子】${s.shots[0].line}`,`---`].concat(s.shots.map(x=>`镜头${x.no}（${x.sec}s）｜${x.view}｜${x.scene}\n台词：${x.line}\n字幕：${x.sub}\n音效：${x.sfx}`)).join("\n");
  navigator.clipboard.writeText(txt).then(()=>toast("已复制全文"));
};
document.getElementById("export").onclick=()=>{
  if(!state.script)return toast("先生成脚本");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(state.script,null,2)],{type:"application/json"}));a.download="脚本-"+state.script.topic+".json";a.click();
};
document.getElementById("clear").onclick=()=>{state.script=null;document.getElementById("meta").textContent="";render()};
init();
</script>
</body>
</html>
