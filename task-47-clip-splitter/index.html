<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>短剧剪辑拆解工具</title>
<style>
  :root{--bg:#0d0f16;--panel:#161a26;--panel2:#1e2334;--line:#2b3249;--text:#eceef6;--muted:#97a0b8;--accent:#ff9a6c;--r:14px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:18px}
  header{text-align:center;padding:10px 0 14px}
  header h1{font-size:24px}header h1 b{color:var(--accent)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
  textarea{width:100%;height:260px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px;font-size:13px;line-height:1.8;resize:vertical;outline:none}
  .btn{background:var(--accent);color:#2a1206;border:none;border-radius:10px;padding:10px 20px;font-size:14px;font-weight:800;cursor:pointer;margin-top:10px}
  .btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{color:var(--muted);text-align:left;padding:7px;border-bottom:1px solid var(--line)}
  td{padding:7px;border-bottom:1px solid rgba(42,48,73,.5);vertical-align:top}
  .tag{font-size:10px;border-radius:6px;padding:2px 7px}
  .t-scene{background:rgba(255,154,108,.15);color:var(--accent)}
  .t-line{background:rgba(108,140,255,.15);color:#8fa8ff}
  .t-sfx{background:rgba(61,220,151,.15);color:var(--green)}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>短剧剪辑<b>拆解</b>工具</h1></header>
  <div class="card">
    <label style="font-size:12px;color:var(--muted)">粘贴剧本/分镜（示例：每行一个镜头，可用「镜头/场景/音效」标记）</label>
    <textarea id="input" placeholder="镜头1（全景）：主角走进办公室。&#10;台词：老板，我要辞职。&#10;音效：紧张氛围音乐&#10;镜头2（特写）：老板的表情凝固。"></textarea>
    <button class="btn" id="run">拆解镜头</button>
    <button class="btn ghost" id="demo">填入示例</button>
    <button class="btn ghost" id="export">导出 TXT</button>
  </div>
  <div class="card"><div id="out"><div style="color:var(--muted);font-size:13px">结果将显示在这里</div></div></div>
</div>
<script>
const DEMO="场景1：办公室 · 日\n镜头1（全景）：主角走进办公室。\n台词：老板，我要辞职。\n音效：紧张氛围音乐\n镜头2（特写）：老板的表情凝固。\n台词：你说什么？\n镜头3（近景）：主角把辞呈拍在桌上。\n音效：重低音\n场景2：走廊 · 日\n镜头4（中景）：主角走出大门，长舒一口气。";
function run(){
  const text=document.getElementById("input").value;
  const lines=text.split(/\n+/).map(l=>l.trim()).filter(Boolean);
  const shots=[];let cur=null;
  const reShot=/^镜头\s*(\d+)/;
  const reScene=/^场景\s*(\d+)/;
  lines.forEach(l=>{
    let m=l.match(reShot);
    if(m){cur={no:shots.length+1,text:"",scene:"",sfx:""};shots.push(cur);cur.text=l;return}
    m=l.match(reScene);
    if(m){if(cur)cur.scene=l;return}
    if(l.startsWith("台词")){if(cur)cur.text+="｜"+l;return}
    if(l.startsWith("音效")||l.startsWith("BGM")){if(cur)cur.sfx=l;return}
    if(cur)cur.text+=" "+l;
  });
  const rows=shots.map(s=>{
    const chars=(s.text||"").replace(/\s/g,"").length;
    const dur=Math.max(1,Math.ceil(chars/4)); // 每 4 字约 1 秒
    return {no:s.no,text:s.text,dur,sfx:s.sfx||""};
  });
  const total=rows.reduce((a,b)=>a+b.dur,0);
  let h=`<table><tr><th>镜头</th><th>内容</th><th>时长(s)</th><th>音效</th></tr>`;
  rows.forEach(r=>{h+=`<tr><td>${r.no}</td><td>${esc(r.text)}</td><td>${r.dur}</td><td>${esc(r.sfx)}</td></tr>`});
  h+=`<tr><td colspan="4" style="color:var(--muted)">合计约 ${total} 秒（${(total/60).toFixed(1)} 分钟）· ${rows.length} 个镜头</td></tr></table>`;
  document.getElementById("out").innerHTML=h;
  window._rows=rows;
}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
document.getElementById("run").onclick=run;
document.getElementById("demo").onclick=()=>{document.getElementById("input").value=DEMO;run()};
document.getElementById("export").onclick=()=>{
  if(!window._rows)return;
  const txt=window._rows.map(r=>`镜头${r.no}（${r.dur}s）｜${r.text}${r.sfx?"｜"+r.sfx:""}`).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/plain;charset=utf-8"}));a.download="剪辑拆解.txt";a.click();
};
</script>
</body>
</html>
