<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 标题/文案生成器</title>
<style>
  :root{
    --bg:#0f1117; --panel:#1a1e2a; --panel2:#222838; --line:#2d3346;
    --text:#e8eaf2; --muted:#9aa3b8; --accent:#6c8cff; --accent2:#38d39f;
    --danger:#ff6b81; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;min-height:100vh}
  .wrap{max-width:980px;margin:0 auto;padding:28px 18px 60px}
  header{text-align:center;padding:26px 0 20px}
  header h1{font-size:30px;font-weight:800;letter-spacing:1px}
  header h1 span{color:var(--accent)}
  header p{color:var(--muted);margin-top:8px;font-size:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:720px){.grid{grid-template-columns:1fr}}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  input[type=text],select,textarea{
    width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:10px 12px;font-size:15px;outline:none;transition:border .2s;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  textarea{min-height:70px;resize:vertical}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .btn{
    background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 20px;
    font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s,opacity .2s;
  }
  .btn:hover{opacity:.9}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
  .btn.green{background:var(--accent2);color:#08241b}
  .btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--muted);cursor:pointer;transition:all .15s}
  .chip:hover,.chip.on{color:#fff;border-color:var(--accent);background:rgba(108,140,255,.15)}
  .result{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .result p{flex:1;font-size:15px;line-height:1.6}
  .result .ops{display:flex;gap:6px;flex-shrink:0}
  .tag{display:inline-block;background:rgba(108,140,255,.14);color:var(--accent);font-size:11px;border-radius:6px;padding:2px 7px;margin-right:6px}
  .empty{color:var(--muted);text-align:center;padding:30px 0;font-size:14px}
  details summary{cursor:pointer;color:var(--muted);font-size:13px;padding:6px 0}
  details .hint{color:var(--muted);font-size:13px;line-height:1.7;padding:6px 0 0}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#2b3350;color:#fff;padding:10px 20px;border-radius:999px;font-size:14px;opacity:0;transition:all .3s;pointer-events:none;z-index:99}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AI 标题<span>/</span>文案生成器</h1>
    <p>输入一个主题，批量生成能"让人点进来"的标题与文案</p>
  </header>

  <div class="card">
    <div class="grid">
      <div>
        <label>主题 / 关键词（必填）</label>
        <input type="text" id="kw" placeholder="例：AI 副业、减脂餐、露营装备、科幻小说……">
      </div>
      <div>
        <label>场景</label>
        <select id="scene"></select>
      </div>
    </div>
    <div style="margin-top:12px">
      <label>风格（可多选）</label>
      <div class="chips" id="styles"></div>
    </div>
    <div class="row" style="margin-top:16px">
      <button class="btn" id="gen">生成文案</button>
      <button class="btn ghost" id="copyAll">复制全部</button>
      <button class="btn ghost" id="exportTxt">导出 TXT</button>
      <button class="btn ghost" id="exportJson">导出 JSON</button>
      <button class="btn ghost" id="favView">只看收藏</button>
    </div>
  </div>

  <div class="card">
    <details>
      <summary>⚙ 高级设置：接入 DeepSeek API（可选，自备 Key）</summary>
      <div class="grid" style="margin-top:10px">
        <div>
          <label>DeepSeek API Key</label>
          <input type="text" id="apiKey" placeholder="sk-...（仅保存在本机浏览器）" autocomplete="off">
        </div>
        <div>
          <label>生成模式</label>
          <select id="mode">
            <option value="rule">模板引擎（免费，无需 Key）</option>
            <option value="ai">AI 生成（需 Key，按量计费）</option>
          </select>
        </div>
      </div>
      <p class="hint">AI 模式下会把"主题+场景+风格"发给 DeepSeek，每条消耗少量 token。Key 只存在浏览器 localStorage，不会上传到其他服务器。</p>
    </details>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <label style="margin:0">生成结果（<span id="count">0</span> 条）</label>
      <button class="btn sm ghost" id="clear">清空</button>
    </div>
    <div id="results"><div class="empty">输入主题，点击"生成文案"开始</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const SCENES = {
  novel: { name:"小说书名", items:[
    "开局{kw}，我成了全服公敌","{kw}：从被退婚开始逆袭","我靠{kw}在修仙界卷疯了",
    "绑定{kw}系统后，我躺平了","{kw}：重生之卷翻诸天","被{kw}追杀三年，我反手屠了满门",
    "带着{kw}穿越到末日","{kw}副本：开局一把刀","我在{kw}里养了一整个宗门",
    "{kw}禁忌：第七次轮回","全宇宙都在找{kw}","{kw}之主，自废修为重修",
    "惊！{kw}竟然是我家看门狗","{kw}签到千年，一出山举世皆惊","大反派也有{kw}梦",
    "我的{kw}能无限进化","{kw}：从捡破烂到建星河","替身{kw}：真身已成仙",
    "把{kw}养到满级后，我无敌了","{kw}镇守人间三千年"
  ]},
  video: { name:"短视频标题", items:[
    "关于{kw}，90%的人都搞错了","{kw}的真相，今天一次性说清楚","别再乱搞{kw}了！这3个坑别踩",
    "看完这个{kw}视频，我后悔没早知道","{kw}入门，保姆级教程","为什么你的{kw}总是不赚钱？",
    "{kw}实测30天，结果震惊了","教你3招，把{kw}玩明白","{kw}翻车现场，笑死我了",
    "月入3万的人，都在偷偷做{kw}","{kw}避坑指南，血泪教训","一个视频讲透{kw}",
    "{kw}原来可以这么简单","90后靠{kw}逆袭的真实经历","千万别小看{kw}，它能改命",
    "{kw}天花板，长这样","{kw}入门到放弃？不存在的","我用{kw}赚到了第一桶金",
    "全网都在吹的{kw}，真有那么神？","{kw}冷知识，最后一个绝了"
  ]},
  wechat: { name:"公众号标题", items:[
    "{kw}，正在悄悄改变普通人的生活","关于{kw}，我想说几句大实话","{kw}的底层逻辑，一次讲透",
    "为什么我劝你早点搞{kw}？","{kw}时代，普通人还有机会吗","{kw}深度拆解：别再交智商税",
    "读完这篇{kw}文章，我卸载了所有焦虑","{kw}的 5 个真相，越早知道越好","{kw}：2026 最值得关注的事",
    "从 0 到 1 做{kw}，我踩过的坑","{kw}入门指南：新手必看","一个月后，我把{kw}做成了副业",
    "{kw}背后的生意，比你想象的大","{kw}，正在淘汰一批人","写给想靠{kw}赚钱的你",
    "{kw}年度复盘：有人赚麻了","{kw}的尽头，到底是什么？","{kw}：普通人的新机会",
    "我研究了 100 个{kw}案例，发现了规律","{kw}避坑清单：第 7 条最扎心"
  ]},
  ecom: { name:"电商卖点", items:[
    "{kw}，用过就回不去了","{kw}到手价，比双十一还狠","{kw}：细节控狂喜",
    "拒绝智商税，{kw}只买对的","{kw}，今天下单立减 50","{kw}库存告急，最后一波",
    "实测{kw} 30 天，效果看得见","{kw}闭眼入，售后无忧","{kw}：颜值与实力并存",
    "{kw}首发价，错过再等一年","{kw}差评率不到 1%，凭什么？","{kw}用了才知道什么叫真香",
    "3 个理由告诉你，{kw}值得买","{kw}到手仅需 X 元，附赠礼包","{kw}升级款，更轻更耐用",
    "{kw}老用户回购率 70%+","{kw}全网比价，我们最低","{kw}开箱实测，惊艳到我了",
    "{kw}买一送一，手慢无","{kw}：贵有贵的道理"
  ]},
  slogan: { name:"广告金句", items:[
    "{kw}，让生活简单一点","有{kw}，才有底气","{kw}，越懂越爱",
    "人生得意须尽欢，{kw}相伴更尽兴","{kw}，为认真生活的人准备","不将就，从{kw}开始",
    "{kw}，把时间还给热爱","{kw}，你的另一种生活方式","好日子，从{kw}开始",
    "{kw}，懂你每一次选择","选择{kw}，就是选择品质","{kw}，让每一次都值得",
    "世界很大，{kw}陪你出发","{kw}，刚刚好的美好","认真生活，认真{kw}",
    "{kw}，不止于好","{kw}，平凡日子的光","把日子过成诗，从{kw}开始",
    "{kw}，陪伴是最长情的告白","{kw}，为热爱买单"
  ]}
};

const STYLES = {
  hong: { name:"炸裂吸睛", prefix:["惊爆！","重磅！","全网疯传！","绝了！","后悔没早看到！"], suffix:["看完直呼内行","信息量巨大","第 3 条绝了","不转不是人","收藏起来慢慢看"] },
  xuan: { name:"悬念钩子", prefix:["99% 的人不知道","你一定想不到","偷偷告诉你","别告诉别人"], suffix:["原因竟是这个","真相让人沉默","结果太意外","最后一条藏不住了"] },
  wen: { name:"文艺走心", prefix:[], suffix:["温柔且有力量","写给认真生活的你","日子再忙，也要好好过"] },
  gan: { name:"干货实用", prefix:["保姆级教程","一文讲透","避坑指南","实操干货"], suffix:["建议收藏","新手必看","附清单","亲测有效"] }
};

const state = { favs: JSON.parse(localStorage.getItem("aig_favs")||"[]"), items: [], favOnly:false };

function init(){
  const sceneSel = document.getElementById("scene");
  Object.entries(SCENES).forEach(([k,v])=>{ const o=document.createElement("option"); o.value=k; o.textContent=v.name; sceneSel.appendChild(o); });
  const stylesBox = document.getElementById("styles");
  Object.entries(STYLES).forEach(([k,v])=>{ const c=document.createElement("span"); c.className="chip"; c.textContent=v.name; c.dataset.k=k; c.addEventListener("click",()=>c.classList.toggle("on")); stylesBox.appendChild(c); });
  const k = document.getElementById("apiKey");
  k.value = localStorage.getItem("aig_key")||"";
  k.addEventListener("input",()=>localStorage.setItem("aig_key",k.value));
  document.getElementById("mode").value = localStorage.getItem("aig_mode")||"rule";
  document.getElementById("mode").addEventListener("change",e=>localStorage.setItem("aig_mode",e.target.value));
}

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function randInt(min,max){ return min+Math.floor(Math.random()*(max-min+1)); }

function fill(tpl, kw){
  return tpl
    .replace(/\{kw\}/g, kw)
    .replace(/\{n\}/g, randInt(2,9));
}

function ruleGen(){
  const kw = document.getElementById("kw").value.trim();
  if(!kw){ toast("请先输入主题/关键词"); return; }
  const scene = document.getElementById("scene").value;
  const chosen = [...document.querySelectorAll("#styles .chip.on")].map(c=>c.dataset.k);
  const styleKeys = chosen.length ? chosen : Object.keys(STYLES);
  const tpls = SCENES[scene].items.slice();
  const out = [];
  for(let i=0;i<Math.min(12,tpls.length*3);i++){
    const tpl = pick(tpls);
    const st = pick(styleKeys);
    const stc = STYLES[st];
    let text = fill(tpl, kw);
    if(stc.prefix.length && Math.random()<0.45) text = pick(stc.prefix)+text;
    if(stc.suffix.length && Math.random()<0.5) text = text+pick(stc.suffix);
    if(!out.some(x=>x.text===text)) out.push({text, style:STYLES[st].name, scene:SCENES[scene].name});
    if(out.length>=12) break;
  }
  if(!out.length){ out.push({text:`${kw}：值得一试的新选择`, style:"默认", scene:SCENES[scene].name}); }
  return out;
}

async function aiGen(){
  const kw = document.getElementById("kw").value.trim();
  if(!kw){ toast("请先输入主题/关键词"); return []; }
  const key = document.getElementById("apiKey").value.trim();
  if(!key){ toast("AI 模式需要先在高级设置里填入 DeepSeek Key"); return []; }
  const scene = document.getElementById("scene").value;
  const chosen = [...document.querySelectorAll("#styles .chip.on")].map(c=>STYLES[c.dataset.k].name);
  const styleDesc = chosen.length ? chosen.join("、") : Object.values(STYLES).map(s=>s.name).join("、");
  const prompt = `你是资深文案专家。请为「${kw}」生成 12 条${SCENES[scene].name}，风格要求：${styleDesc}。每条不超过 30 字，直接输出编号列表，不要解释。`;
  try{
    const resp = await fetch("https://api.deepseek.com/chat/completions",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":`Bearer ${key}`},
      body: JSON.stringify({ model:"deepseek-chat", messages:[{role:"user",content:prompt}], temperature:1.1, max_tokens:800 })
    });
    if(!resp.ok) throw new Error("HTTP "+resp.status);
    const data = await resp.json();
    const text = data.choices[0].message.content;
    const lines = text.split("\n").map(l=>l.replace(/^\d+[\.、\)\s]*/,"").trim()).filter(l=>l.length>=4 && l.length<=60);
    return lines.slice(0,12).map(t=>({text:t, style:"AI", scene:SCENES[scene].name}));
  }catch(e){
    toast("AI 生成失败："+e.message);
    return [];
  }
}

async function generate(){
  const mode = document.getElementById("mode").value;
  const btn = document.getElementById("gen");
  btn.disabled = true; btn.textContent = "生成中…";
  let out = mode==="ai" ? await aiGen() : ruleGen();
  if(mode==="ai" && !out.length){ out = ruleGen(); }
  state.items = out;
  render();
  btn.disabled = false; btn.textContent = "生成文案";
}

function render(){
  const box = document.getElementById("results");
  const list = state.favOnly ? state.items.filter(i=>state.favs.includes(i.text)) : state.items;
  document.getElementById("count").textContent = list.length;
  if(!list.length){ box.innerHTML = '<div class="empty">'+(state.favOnly?"还没有收藏任何文案":"输入主题，点击“生成文案”开始")+'</div>'; return; }
  box.innerHTML = "";
  list.forEach(it=>{
    const d = document.createElement("div");
    d.className = "result";
    const faved = state.favs.includes(it.text);
    d.innerHTML = `<p><span class="tag">${it.scene}</span><span class="tag">${it.style}</span>${escapeHtml(it.text)}</p>
      <div class="ops">
        <button class="btn sm ghost">复制</button>
        <button class="btn sm ghost">${faved?"★":"☆"}</button>
      </div>`;
    d.querySelectorAll("button")[0].addEventListener("click",()=>{ navigator.clipboard.writeText(it.text).then(()=>toast("已复制")); });
    d.querySelectorAll("button")[1].addEventListener("click",()=>{
      const i = state.favs.indexOf(it.text);
      if(i>=0) state.favs.splice(i,1); else state.favs.push(it.text);
      localStorage.setItem("aig_favs", JSON.stringify(state.favs));
      render();
    });
    box.appendChild(d);
  });
}

function escapeHtml(s){ return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("show"), 1800);
}

document.getElementById("gen").addEventListener("click", generate);
document.getElementById("copyAll").addEventListener("click", ()=>{
  if(!state.items.length) return toast("还没有生成内容");
  navigator.clipboard.writeText(state.items.map(i=>i.text).join("\n")).then(()=>toast("已复制全部 "+state.items.length+" 条"));
});
document.getElementById("exportTxt").addEventListener("click", ()=>{
  if(!state.items.length) return toast("还没有生成内容");
  const blob = new Blob([state.items.map((i,idx)=>`${idx+1}. ${i.text}`).join("\n")], {type:"text/plain;charset=utf-8"});
  download(blob, "文案生成结果.txt");
});
document.getElementById("exportJson").addEventListener("click", ()=>{
  if(!state.items.length) return toast("还没有生成内容");
  const blob = new Blob([JSON.stringify(state.items,null,2)], {type:"application/json;charset=utf-8"});
  download(blob, "文案生成结果.json");
});
document.getElementById("favView").addEventListener("click", ()=>{
  state.favOnly = !state.favOnly;
  document.getElementById("favView").textContent = state.favOnly ? "看全部" : "只看收藏";
  render();
});
document.getElementById("clear").addEventListener("click", ()=>{ state.items=[]; render(); });
function download(blob,name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click(); URL.revokeObjectURL(a.href); }

init();
render();
</script>
</body>
</html>
