<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山海百妖录 · 肉鸽卡牌</title>
<style>
  :root{--bg:#0b0e15;--panel:#131827;--panel2:#1a2133;--line:#29314a;--text:#e9ecf5;--muted:#93a0b8;--gold:#ffc24d;--red:#ff6b81;--green:#3ddc97;--blue:#6c8cff;--purple:#c084fc;--r:14px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
  .wrap{max-width:900px;margin:0 auto;padding:16px}
  header{display:flex;justify-content:space-between;align-items:center;padding:6px 0 12px;flex-wrap:wrap;gap:6px}
  header h1{font-size:22px;letter-spacing:2px}header h1 span{color:var(--purple)}
  .bars{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .bar{flex:1;min-width:200px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
  .bar .l{font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
  .track{height:7px;background:#221a20;border-radius:99px;overflow:hidden;margin-top:5px}
  .track i{display:block;height:100%;border-radius:99px;transition:width .25s}
  #enemy{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;text-align:center;margin-bottom:10px}
  #enemy h2{font-size:20px}
  #enemy .desc{color:var(--muted);font-size:12px;margin-top:2px}
  #enemy .next{color:var(--red);font-size:12px;margin-top:4px}
  #log{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;height:108px;overflow-y:auto;font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:10px}
  #hand{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:150px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;width:112px;padding:10px;cursor:pointer;text-align:center;transition:transform .1s,border .15s;position:relative;border-top:3px solid var(--muted)}
  .card:hover{transform:translateY(-5px);border-color:var(--gold)}
  .card.dis{opacity:.42;cursor:not-allowed}
  .card .cost{position:absolute;top:-7px;left:-7px;background:var(--blue);color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
  .card .nm{font-weight:800;font-size:14px;margin:4px 0 2px}
  .card .tx{font-size:11px;line-height:1.5;color:#cdd3e4;min-height:32px}
  .card.rare{border-top-color:var(--blue)}
  .card.epic{border-top-color:var(--purple)}
  .row{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
  .btn{background:var(--gold);color:#2a1d00;border:none;border-radius:999px;padding:10px 24px;font-size:14px;font-weight:800;cursor:pointer}
  .btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
  #relics{font-size:11px;color:var(--gold);margin-top:6px}
  .overlay{position:fixed;inset:0;background:rgba(8,10,16,.94);display:flex;align-items:center;justify-content:center;z-index:9;overflow-y:auto}
  .overlay .box{max-width:820px;width:100%;padding:20px;text-align:center}
  .overlay h2{font-size:24px;color:var(--gold);margin-bottom:16px}
  .chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
  .ch{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:.15s}
  .ch:hover{border-color:var(--purple);transform:translateY(-3px)}
  .ch .ico{font-size:34px}
  .ch h3{font-size:16px;margin:6px 0 4px}
  .ch .ps{font-size:12px;color:var(--green);margin-bottom:6px}
  .ch .ds{font-size:11px;color:var(--muted);line-height:1.6}
  .loot{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
  .loot .item{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;width:150px;cursor:pointer;text-align:center}
  .loot .item:hover{border-color:var(--gold)}
  .loot .item .rar{font-size:10px;color:var(--blue)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>山海<span>百妖录</span></h1>
    <div style="font-size:12px;color:var(--muted)">第 <b id="floor">1</b> 战 · 历史最佳 <b id="best" style="color:var(--gold)">0</b></div>
  </header>
  <div class="bars">
    <div class="bar"><div class="l"><span id="cname">御灵师</span><span><b id="php">60</b>/60</span></div><div class="track"><i id="phbar" style="width:100%;background:linear-gradient(90deg,#ff6b81,#ff9aa5)"></i></div></div>
    <div class="bar"><div class="l"><span>灵力</span><span><b id="mp">3</b>/3</span></div><div class="track"><i id="mpbar" style="width:100%;background:linear-gradient(90deg,#6c8cff,#9bb2ff)"></i></div></div>
    <div class="bar"><div class="l"><span>金币 <b id="gold" style="color:var(--gold)">0</b></span><span>护甲 <b id="armor">0</b></span></div><div class="track"><i id="armorbar" style="width:0;background:linear-gradient(90deg,#c084fc,#e2b3ff)"></i></div></div>
  </div>
  <div id="relics"></div>
  <div id="enemy"><h2 id="ename">—</h2><div class="desc" id="edesc"></div><div style="margin:8px auto;max-width:360px"><div class="track"><i id="ehbar" style="width:100%;background:linear-gradient(90deg,#c084fc,#e2b3ff)"></i></div></div><div class="next" id="eatk"></div></div>
  <div id="log"></div>
  <div id="hand"></div>
  <div class="row">
    <button class="btn" id="endTurn">结束回合</button>
    <button class="btn ghost" id="restart">重开</button>
  </div>
</div>

<div class="overlay" id="select">
  <div class="box"><h2>选择御灵师</h2>
    <div class="chars" id="chars"></div>
  </div>
</div>

<script>
"use strict";
const CHARS=[
  {id:"fire",name:"焚炎·赤羽",ico:"🔥",hp:58,ps:"焚炎：每场战斗首张攻击牌伤害+2",ds:"攻击凶悍，越战越勇",passive:"fire"},
  {id:"water",name:"沧海·沧澜",ico:"🌊",hp:66,ps:"潮汐：每回合灵力+1",ds:"灵力充裕，节奏大师",passive:"water"},
  {id:"wood",name:"青木·青芽",ico:"🌿",hp:76,ps:"回春：战斗胜利恢复 5 生命",ds:"坚韧续航，稳扎稳打",passive:"wood"}
];
const RAR={c:"普通",r:"稀有",e:"史诗"};
const CARD_DEFS=[
  {n:"火球",c:1,a:6,r:"c",t:"造成 6 伤害"},
  {n:"水刃",c:1,a:5,r:"c",t:"造成 5 伤害"},
  {n:"藤鞭",c:1,a:4,r:"c",t:"造成 4 伤害"},
  {n:"斩击",c:1,a:7,r:"c",t:"造成 7 伤害"},
  {n:"玄龟甲",c:1,arm:5,r:"c",t:"获得 5 护甲"},
  {n:"灵犀一指",c:1,a:5,draw:1,r:"c",t:"5 伤害，抽 1 张"},
  {n:"烈焰斩",c:2,a:12,r:"r",t:"造成 12 伤害"},
  {n:"寒冰甲",c:2,arm:10,r:"r",t:"获得 10 护甲"},
  {n:"摄魂铃",c:2,a:8,heal:4,r:"r",t:"8 伤害，回 4 血"},
  {n:"灵木缠",c:2,a:8,arm:6,r:"r",t:"8 伤害，6 护甲"},
  {n:"凤凰羽",c:2,a:10,draw:1,r:"r",t:"10 伤害，抽 1"},
  {n:"龙息",c:3,a:20,r:"e",t:"造成 20 伤害"},
  {n:"玄武真身",c:3,arm:18,r:"e",t:"获得 18 护甲"},
  {n:"九尾惑心",c:3,a:14,heal:8,r:"e",t:"14 伤害，回 8 血"},
  {n:"天雷",c:3,a:18,draw:2,r:"e",t:"18 伤害，抽 2"}
];
const RELICS=[
  {n:"焚天珠",d:"攻击伤害+2",f:p=>p.atkBonus+=2},
  {n:"沧海镜",d:"灵力上限+1",f:p=>p.maxMp+=1},
  {n:"青木心",d:"生命上限+15",f:p=>{p.maxHp+=15;p.hp+=15}},
  {n:"灵犀角",d:"每回合抽牌+1",f:p=>p.draw+=1},
  {n:"玄武壳",d:"回合开始获得2护甲",f:p=>p.shell=2},
  {n:"雷公符",d:"暴击15%双倍",f:p=>p.crit=15},
  {n:"血玉",d:"攻击吸血20%",f:p=>p.vamp=20},
  {n:"青云靴",d:"开局多2灵力",f:p=>p.startMp+=2}
];
const ENEMIES=[
  {n:"山精",d:"山林小妖，扔石头",hp:30,atk:6},
  {n:"狐妖",d:"青丘狐魅，惑人心",hp:38,atk:7},
  {n:"夜叉",d:"海鬼力大",hp:46,atk:9},
  {n:"穷奇",d:"四凶之一",hp:58,atk:11},
  {n:"年兽",d:"上古凶兽 · Boss",hp:85,atk:14}
];
let P,floor,gold,best=+localStorage.getItem("sh_best")||0,hand,deck,disc,enemy,log,relics;
const $=id=>document.getElementById(id);
function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function DEF(n){const d=CARD_DEFS.find(c=>c.n===n);return {...d}}
function baseDeck(id){
  const map={
    fire:["火球","火球","斩击","斩击","玄龟甲","灵犀一指"],
    water:["水刃","水刃","斩击","玄龟甲","玄龟甲","灵犀一指"],
    wood:["藤鞭","藤鞭","藤鞭","玄龟甲","斩击","灵犀一指"]
  };
  return (map[id]||[]).map(n=>DEF(n));
}
function addCard(n){deck.push(DEF(n))}
function startGame(cid){
  const c=CHARS.find(x=>x.id===cid);
  P={cid,hp:c.hp,maxHp:c.hp,mp:3,maxMp:3,armor:0,atkBonus:0,draw:5,crit:0,vamp:0,shell:0,startMp:0,firstFire:true};
  floor=1;gold=0;relics=[];log=[];
  deck=shuffle(baseDeck(cid));disc=[];hand=[];
  $("cname").textContent=c.name+" · "+c.ps;
  document.getElementById("select").style.display="none";
  startBattle();
}
function startBattle(){
  const boss=floor%5===0;
  const base=ENEMIES[Math.min(floor-1,ENEMIES.length-1)];
  const scale=1+Math.floor((floor-1)/ENEMIES.length)*0.35;
  enemy={n:(boss?"Boss·":"")+base.n,d:base.d,hp:Math.floor(base.hp*scale),max:Math.floor(base.hp*scale),atk:Math.ceil(base.atk*scale),armor:0,boss};
  hand=[];deck=shuffle(deck.concat(disc));disc=[];
  P.mp=Math.min(P.maxMp,P.startMp||3);P.armor=0;P.firstFire=true;
  draw(P.draw);render();
  logTo("⚔ 遭遇【"+enemy.n+"】"+enemy.d+(boss?"（Boss！）":""));
}
function draw(n){
  for(let i=0;i<n;i++){
    if(!deck.length){deck=shuffle(disc);disc=[]}
    if(deck.length)hand.push(deck.pop());
  }
}
function play(card){
  if(P.mp<card.c)return;
  P.mp-=card.c;
  hand.splice(hand.indexOf(card),1);
  let dmg=card.a||0;
  if(dmg){
    dmg+=P.atkBonus;
    if(P.crit&&rnd(100)<P.crit){dmg*=2;logTo("⚡ 暴击！")}
    if(P.firstFire&&P.cid==="fire"){dmg+=2;P.firstFire=false;logTo("🔥 焚炎生效")}
    enemy.hp-=dmg;logTo("你对【"+enemy.n+"】造成 "+dmg+" 伤害");
    if(P.vamp)P.hp=Math.min(P.maxHp,P.hp+Math.max(1,Math.floor(dmg*P.vamp/100)));
  }
  if(card.arm)P.armor+=card.arm;
  if(card.heal)P.hp=Math.min(P.maxHp,P.hp+card.heal);
  if(card.draw)draw(card.draw);
  disc.push(card);
  render();
  if(enemy.hp<=0)winBattle();
}
function endTurn(){
  if(enemy.hp>0){
    const d=Math.max(1,enemy.atk-P.armor);
    P.armor=Math.max(0,P.armor-enemy.atk);
    P.hp-=d;
    logTo("【"+enemy.n+"】攻击你 "+d+" 伤害");
    if(P.hp<=0){P.hp=0;render();logTo("💀 你被妖物击败…");if(floor>best){best=floor;localStorage.setItem("sh_best",best)}render();return}
  }
  P.mp=Math.min(P.maxMp,P.mp+3+(P.cid==="water"?1:0));
  if(P.shell)P.armor+=P.shell;
  disc.push(...hand);hand=[];
  draw(P.draw);
  render();
}
function winBattle(){
  const goldReward=8+floor*2;
  gold+=goldReward;
  logTo("✅ 击败【"+enemy.n+"】，金币 +"+goldReward);
  if(P.cid==="wood"){P.hp=Math.min(P.maxHp,P.hp+5);logTo("🌿 回春：恢复 5 生命")}
  if(floor>best){best=floor;localStorage.setItem("sh_best",best)}
  if(enemy.boss)logTo("👑 Boss 讨伐成功！");
  showReward();
}
function showReward(){
  const pick3=[];
  const seen=new Set();
  while(pick3.length<3){
    const r=Math.random();
    const tier=r<0.55?"c":r<0.88?"r":"e";
    const opts=CARD_DEFS.filter(c=>c.r===tier&&!seen.has(c.n));
    if(!opts.length)continue;
    const c=opts[rnd(opts.length)];seen.add(c.n);pick3.push(c);
  }
  overlay(`<h2>战利品 · 三选一</h2><div class="loot">${pick3.map((c,i)=>`<div class="item" data-i="${i}"><div class="rar">${RAR[c.r]}</div><b>${c.n}</b><p style="font-size:11px;color:var(--muted);margin-top:4px">${c.t}</p></div>`).join("")}</div>
    <div class="row"><button class="btn ghost" data-skip="1">跳过</button></div>`,box=>{
    box.querySelectorAll(".item").forEach(el=>el.onclick=()=>{addCard(pick3[+el.dataset.i].n);closeOverlay();afterBattle()});
    box.querySelector("[data-skip]").onclick=()=>{closeOverlay();afterBattle()};
  });
}
function afterBattle(){
  floor++;
  if(floor%5===2){showShop()}else{startBattle()}
}
function showShop(){
  const shopItems=[];
  const cardPool=CARD_DEFS.filter(c=>c.r!=="e");
  shopItems.push({type:"card",price:12+floor*2,item:cardPool[rnd(cardPool.length)]});
  shopItems.push({type:"card",price:12+floor*2,item:cardPool[rnd(cardPool.length)]});
  const rel=RELICS[rnd(RELICS.length)];
  shopItems.push({type:"relic",price:25+floor*3,item:rel});
  shopItems.push({type:"heal",price:12,item:{n:"疗伤丹",t:"恢复 15 生命"}});
  overlay(`<h2>坊市 · 战后补给</h2><div class="loot">${shopItems.map((s,i)=>`<div class="item" data-i="${i}"><b>${s.type==="relic"?"遗物":s.type==="heal"?"丹药":"卡牌"}</b><div style="margin:4px 0">${s.item.n}</div><div class="rar">${s.price} 金</div></div>`).join("")}</div>
    <div class="row"><button class="btn" data-go="1">离开坊市</button></div>`,box=>{
    box.querySelectorAll(".item").forEach(el=>el.onclick=()=>{
      const s=shopItems[+el.dataset.i];
      if(gold<s.price){logTo("金币不足");return}
      gold-=s.price;
      if(s.type==="card")addCard(s.item.n);
      else if(s.type==="relic"){s.item.f(P);relics.push(s.item);logTo("✨ 获得遗物【"+s.item.n+"】")}
      else{P.hp=Math.min(P.maxHp,P.hp+15);logTo("💊 服用疗伤丹 +15")}
      el.style.opacity=.4;el.style.pointerEvents="none";
      render();
    });
    box.querySelector("[data-go]").onclick=()=>{closeOverlay();startBattle()};
  });
}
function overlay(html,setup){
  const o=document.createElement("div");o.className="overlay";o.innerHTML=`<div class="box">${html}</div>`;
  document.body.appendChild(o);window._ov=o;
  if(setup)setup(o.querySelector(".box"));
}
function closeOverlay(){if(window._ov){window._ov.remove();window._ov=null}}
function render(){
  $("floor").textContent=floor;
  $("best").textContent=best;
  $("php").textContent=Math.max(0,P.hp)+"/"+P.maxHp;
  $("phbar").style.width=Math.max(0,P.hp/P.maxHp*100)+"%";
  $("mp").textContent=P.mp+"/"+P.maxMp;
  $("mpbar").style.width=P.mp/P.maxMp*100+"%";
  $("gold").textContent=gold;
  $("armor").textContent=P.armor;
  $("armorbar").style.width=Math.min(100,P.armor/20*100)+"%";
  $("relics").textContent=relics.length?("遗物："+relics.map(r=>r.n).join(" · ")):"";
  if(enemy){
    $("ename").textContent=enemy.n;
    $("edesc").textContent=enemy.d+(enemy.armor?" · 护甲 "+enemy.armor:"");
    $("ehbar").style.width=Math.max(0,enemy.hp/enemy.max*100)+"%";
    $("eatk").textContent="下回合攻击 "+enemy.atk+" · 生命 "+Math.max(0,enemy.hp)+"/"+enemy.max;
  }
  const hb=$("hand");hb.innerHTML="";
  hand.forEach(c=>{
    const d=document.createElement("div");
    d.className="card "+c.r+(P.mp<c.c?" dis":"");
    d.innerHTML=`<div class="cost">${c.c}</div><div class="nm">${c.n}</div><div class="tx">${c.t}</div>`;
    d.onclick=()=>play(c);
    hb.appendChild(d);
  });
  if(!hand.length)hb.innerHTML='<div style="color:var(--muted);padding:20px">手牌为空，点击结束回合</div>';
}
function logTo(s){const l=$("log");l.innerHTML+=`<div>${s}</div>`;l.scrollTop=l.scrollHeight}
function initSelect(){
  const box=$("chars");
  CHARS.forEach(c=>{
    const d=document.createElement("div");d.className="ch";
    d.innerHTML=`<div class="ico">${c.ico}</div><h3>${c.name}</h3><div class="ps">${c.ps}</div><div class="ds">${c.ds} · 初始生命 ${c.hp}</div>`;
    d.onclick=()=>startGame(c.id);
    box.appendChild(d);
  });
}
$("endTurn").onclick=endTurn;
$("restart").onclick=()=>{logTo("— 重新开始 —");location.reload()};
initSelect();
</script>
</body>
</html>
